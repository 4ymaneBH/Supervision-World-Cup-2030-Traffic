[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-traffic-supervision"
version = "0.1.0"
description = "Streaming transport and spectator supervision demo for World Cup 2030"
requires-python = ">=3.10,<3.14"
dependencies = [
  "confluent-kafka>=2.5,<3",
  "dash>=3,<4",
  "h3>=4.1,<5",
  "pyspark==4.0.1",
  "redis>=5,<8",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fakeredis>=2,<3"]

[tool.setuptools.packages.find]
include = ["worldcup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
